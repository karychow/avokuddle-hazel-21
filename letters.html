<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>{{titles.letters}}</title>
  <meta name="theme-color" content="#140509">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="mailbox-page">
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="sketch" x="-4%" y="-20%" width="108%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <canvas class="lily lily-left" id="lilyLeft" aria-hidden="true"></canvas>
  <canvas class="lily lily-right" id="lilyRight" aria-hidden="true"></canvas>

  <div class="app">
    <section class="private" id="private" hidden>
      <div class="private-lock" aria-hidden="true">♡</div>
      <p class="private-title ink">{{labels.privateTitle}}</p>
      <p class="private-text ink">{{labels.privateText}}</p>
    </section>

    <main class="mailbox-main" id="mailboxMain" hidden>
      <p class="mark ink">{{labels.mailboxTitle}}</p>
      <ul class="mailbox" id="mailbox" aria-label="letters"></ul>
      <p class="mailbox-empty ink" id="mailboxEmpty" hidden>{{labels.mailboxEmpty}}</p>
    </main>

    <footer class="foot ink">{{siteName}}</footer>
  </div>

  <div class="letter-view" id="letterView" hidden role="dialog" aria-modal="true" aria-label="letter"></div>

  <script src="/js/bloom.js"></script>
  <script src="/js/music.js"></script>
  <script type="module" src="/src/letters.js"></script>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
